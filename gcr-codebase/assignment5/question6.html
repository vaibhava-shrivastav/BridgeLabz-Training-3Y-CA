<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="question6.css">
</head>
<body>
    <header class="header">
        <h1>Our Gallery</h1>
        <p>Explore our collection of stunning images</p>
    </header>

    <main class="gallery-container">
        <!-- Gallery Image 1 -->
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Image+1" alt="Gallery Image 1">
            <div class="caption">Beautiful Landscape</div>
        </div>

        <!-- Gallery Image 2 -->
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Image+2" alt="Gallery Image 2">
            <div class="caption">Mountain View</div>
        </div>

        <!-- Gallery Image 3 -->
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Image+3" alt="Gallery Image 3">
            <div class="caption">Ocean Sunset</div>
        </div>

        <!-- Gallery Image 4 -->
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Image+4" alt="Gallery Image 4">
            <div class="caption">Forest Path</div>
        </div>

        <!-- Gallery Image 5 -->
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Image+5" alt="Gallery Image 5">
            <div class="caption">City Lights</div>
        </div>

        <!-- Gallery Image 6 -->
        <div class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Image+6" alt="Gallery Image 6">
            <div class="caption">Desert Dunes</div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Photo Gallery. All rights reserved.</p>
    </footer>
</body>
</html>
