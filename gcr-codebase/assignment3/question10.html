<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Travel Selection</title></head>
<body>
    <h1>Choose Your Travel Preferences</h1>
    <form action="#" method="get">
        <p><label for="country">Country:</label><select id="country" name="country"><option value="india" selected>India</option><option value="japan">Japan</option><option value="italy">Italy</option></select></p>
        <p><label for="state">State:</label><select id="state" name="state"><option value="uttar-pradesh" selected>Uttar Pradesh</option><option value="goa">Goa</option><option value="kerala">Kerala</option></select></p>
        <p><label for="city">City:</label><select id="city" name="city"><option value="agra" selected>Agra</option><option value="varanasi">Varanasi</option><option value="lucknow">Lucknow</option></select></p>
        <p><label for="place">Favorite Tourist Place:</label><select id="place" name="place"><option value="taj-mahal" selected>Taj Mahal</option><option value="fort">Agra Fort</option><option value="fatehpur">Fatehpur Sikri</option></select></p>
        <p>Your choices are India, Uttar Pradesh, Agra, and the Taj Mahal.</p>
    </form>
</body>
</html>
