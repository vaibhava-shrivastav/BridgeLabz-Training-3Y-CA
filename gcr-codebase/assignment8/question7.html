<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>UI Components</title><link rel="stylesheet" href="question7.css"></head>
<body><main><section class="ui-card"><header><p class="eyebrow">Workspace</p><h1>Find your next idea</h1></header><form class="search"><label for="search">Search the library</label><div><input id="search" type="search" placeholder="Try a topic"><button type="submit">Search</button></div></form><div class="actions"><button type="button">New collection</button><button type="button" class="quiet">Save draft</button><label for="sort">Sort by<select id="sort"><option>Most recent</option><option>Most popular</option><option>Alphabetical</option></select></label></div></section></main></body>
</html>
