<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Tooltips</title><link rel="stylesheet" href="question2.css"></head>
<body>
    <main>
        <header><p class="eyebrow">Hover glossary</p><h1>Tooltip studio</h1><p>Hover each word to reveal a CSS-only tooltip.</p></header>
        <section class="tooltip-row" aria-label="Tooltip examples">
            <span class="tip-item">Flexbox<span class="tooltip">One-dimensional layout</span></span>
            <span class="tip-item">Grid<span class="tooltip">Two-dimensional layout</span></span>
            <span class="tip-item">Opacity<span class="tooltip">Controls transparency</span></span>
            <span class="tip-item">Padding<span class="tooltip">Space inside a box</span></span>
        </section>
    </main>
</body>
</html>
