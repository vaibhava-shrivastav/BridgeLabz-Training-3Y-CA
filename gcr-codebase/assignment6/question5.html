<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Section</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>
    <section class="pricing">
        <h1 class="pricing-title">Choose Your Plan</h1>
        <div class="cards">
            <div class="card">
                <h2>Basic</h2>
                <p class="price">$9<span>/mo</span></p>
                <ul>
                    <li>5 GB Storage</li>
                    <li>1 User</li>
                    <li>Email Support</li>
                </ul>
                <button>Get Started</button>
            </div>
            <div class="card featured">
                <h2>Pro</h2>
                <p class="price">$29<span>/mo</span></p>
                <ul>
                    <li>50 GB Storage</li>
                    <li>10 Users</li>
                    <li>Priority Support</li>
                </ul>
                <button>Get Started</button>
            </div>
            <div class="card">
                <h2>Enterprise</h2>
                <p class="price">$79<span>/mo</span></p>
                <ul>
                    <li>Unlimited Storage</li>
                    <li>Unlimited Users</li>
                    <li>24/7 Support</li>
                </ul>
                <button>Get Started</button>
            </div>
        </div>
    </section>
</body>
</html>
