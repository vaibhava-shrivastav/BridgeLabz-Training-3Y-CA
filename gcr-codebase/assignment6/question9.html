<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="question9.css">
</head>
<body>
    <div class="scene">
        <div class="card">
            <div class="card-face card-front">
                <img src="https://via.placeholder.com/280x180/1a1a2e/ffffff?text=Front" alt="Card Image">
                <h2>Discover More</h2>
            </div>
            <div class="card-face card-back">
                <h2>About This Card</h2>
                <p>This card flips on hover using CSS 3D transforms. It demonstrates perspective, preserve-3d, and rotateY techniques for creating smooth flip animations.</p>
            </div>
        </div>
    </div>
</body>
</html>
