<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>
    <h1 class="gallery-title">Photo Gallery</h1>
    <div class="gallery">
        <figure class="photo">
            <img src="https://via.placeholder.com/400x300/1a1a2e/ffffff?text=Photo+1" alt="Photo 1">
            <figcaption>Mountain Landscape</figcaption>
        </figure>
        <figure class="photo">
            <img src="https://via.placeholder.com/400x300/16213e/ffffff?text=Photo+2" alt="Photo 2">
            <figcaption>Ocean Sunset</figcaption>
        </figure>
        <figure class="photo">
            <img src="https://via.placeholder.com/400x300/0f3460/ffffff?text=Photo+3" alt="Photo 3">
            <figcaption>City Skyline</figcaption>
        </figure>
        <figure class="photo">
            <img src="https://via.placeholder.com/400x300/e94560/ffffff?text=Photo+4" alt="Photo 4">
            <figcaption>Forest Path</figcaption>
        </figure>
        <figure class="photo">
            <img src="https://via.placeholder.com/400x300/533483/ffffff?text=Photo+5" alt="Photo 5">
            <figcaption>Desert Dunes</figcaption>
        </figure>
        <figure class="photo">
            <img src="https://via.placeholder.com/400x300/2b2d42/ffffff?text=Photo+6" alt="Photo 6">
            <figcaption>Northern Lights</figcaption>
        </figure>
    </div>
</body>
</html>
