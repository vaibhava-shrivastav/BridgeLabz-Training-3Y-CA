<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Box Model Exploration</title><link rel="stylesheet" href="question8.css"></head><body><main><header><p>The four layers</p><h1>Box model</h1><p>Read outward from the content at the center.</p></header><section class="model"><div class="margin"><span>margin</span><div class="border"><span>border</span><div class="padding"><span>padding</span><div class="content"><strong>content</strong><small>Text lives here.</small></div></div></div></div></section><section class="comparison"><article><h2>Default content-box</h2><p>Width describes content only, so padding and border add to the final size.</p></article><article class="border-box"><h2>border-box</h2><p>Width includes content, padding, and border for predictable sizing.</p></article></section></main></body></html>
