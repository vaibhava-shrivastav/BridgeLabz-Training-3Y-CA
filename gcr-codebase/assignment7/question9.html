<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Outline and Focus Form</title><link rel="stylesheet" href="question9.css"></head><body><main><section class="panel"><p> A quiet contact form</p><h1>Focus your thoughts</h1><p>Click through the fields to see their focus outlines.</p><form><label for="name">Name<input id="name" type="text" placeholder="Your name"></label><label for="email">Email<input id="email" type="email" placeholder="you@example.com"></label><label for="message">Message<textarea id="message" rows="5" placeholder="Write a short note"></textarea></label><button type="submit">Send note</button></form></section></main></body></html>
