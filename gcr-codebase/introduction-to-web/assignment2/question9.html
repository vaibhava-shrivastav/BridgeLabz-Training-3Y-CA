<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strong and Emphasis</title>
</head>
<body>

    <!-- Using strong and emphasis in the same sentence -->

        and practicing it regularly is <em>extremely useful</em>.
    </p>

</body>
</html>
