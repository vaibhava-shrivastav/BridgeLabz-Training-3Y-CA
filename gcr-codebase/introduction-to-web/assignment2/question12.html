<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Inline Formatting</title>
</head>
<body>

    <!-- Demonstrating multiple inline HTML elements -->
    <p>
        <strong>Learning HTML</strong> is an
        <em>exciting journey</em> for every beginner.<br>

        <mark>Practice makes progress!</mark>
        <small>Keep learning and improving every day.</small>
    </p>

</body>
</html>
