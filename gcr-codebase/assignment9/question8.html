<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 8 - Filter Comparison Layout</title>
    <link rel="stylesheet" href="question8.css" />
  </head>
  <body>
    <main class="comparison-wrap">
      <h1>Filter Comparison</h1>

      <section class="comparison" aria-label="Before and after image comparison">
        <figure class="compare-item">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Original landscape" />
          <figcaption>Before</figcaption>
        </figure>

        <figure class="compare-item after">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Landscape with brightness filter" />
          <figcaption>After</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
