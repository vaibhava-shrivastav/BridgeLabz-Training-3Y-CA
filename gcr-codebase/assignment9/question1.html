<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 1 - Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="question1.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main class="gallery-wrap">
      <section class="gallery" aria-label="Filtered image gallery">
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Forest landscape" />
          <figcaption>Blur</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake" />
          <figcaption>Grayscale</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Beach and cliffs" />
          <figcaption>Sepia</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Sunset over hills" />
          <figcaption>Brightness</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean waves" />
          <figcaption>Contrast</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80" alt="Forest in autumn" />
          <figcaption>Hue Rotate</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
