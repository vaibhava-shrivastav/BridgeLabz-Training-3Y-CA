<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 5 - Filter Cards</title>
    <link rel="stylesheet" href="question5.css" />
  </head>
  <body>
    <main class="profiles">
      <section class="profile-grid" aria-label="Profile cards">
        <article class="profile-card">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=80" alt="Profile portrait of Aisha" />
          <div class="card-content">
            <h2>Aisha</h2>
            <p>UI Designer focusing on clean, user-centered experiences.</p>
          </div>
        </article>

        <article class="profile-card">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80" alt="Profile portrait of Daniel" />
          <div class="card-content">
            <h2>Daniel</h2>
            <p>Front-end developer building engaging interfaces that respond to devices.</p>
          </div>
        </article>

        <article class="profile-card">
          <img src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=900&q=80" alt="Profile portrait of Priya" />
          <div class="card-content">
            <h2>Priya</h2>
            <p>Content strategist blending design systems and responsive storytelling.</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
