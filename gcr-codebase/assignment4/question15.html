<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <!-- 
        Question 15: Payment Form
        Includes fields for card details with required attribute
    -->
    <h1>Payment Form</h1>
    
    <form>
        <!-- Cardholder Name -->
        <label for="cardholderName">Cardholder Name:</label><br>
        <input type="text" id="cardholderName" name="cardholderName" required><br><br>
        
        <!-- Card Number -->
        <label for="cardNumber">Card Number:</label><br>
        <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" required><br><br>
        
        <!-- Expiry Date -->
        <label for="expiryDate">Expiry Date:</label><br>
        <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required><br><br>
        
        <!-- CVV -->
        <label for="cvv">CVV:</label><br>
        <input type="text" id="cvv" name="cvv" placeholder="123" required><br><br>
        
        <!-- Pay Now button -->
        <input type="submit" value="Pay Now">
    </form>
    
</body>
</html>
