<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Website Embed</title>
</head>
<body>
    <!-- 
        Question 14: Embed external website using iframe
    -->
    <h1>External Website Embed</h1>
    
    <!-- Attempt to embed Wikipedia -->
    <iframe 
        src="https://www.wikipedia.org" 
        width="100%" 
        height="500" 
        title="Wikipedia">
    </iframe>
    
    <!-- Security note -->
    <p>
        <strong>Security Note:</strong> Some websites may not allow embedding for security reasons. 
        Many sites use the X-Frame-Options HTTP header to prevent being embedded in iframes. 
        This is a security measure to prevent clickjacking attacks and maintain site security.
    </p>
    
</body>
</html>
