<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with iframe</title>
</head>
<body>
    <!-- 
        Question 17: Form.html - Contains a form with iframe for result display
        The form loads result.html in an iframe after submission
    -->
    <h1>Submit Your Information</h1>
    
    <form target="resultFrame">
        <!-- Text input -->
        <label for="textInput">Enter your name:</label><br>
        <input type="text" id="textInput" name="name" required><br><br>
        
        <!-- Submit button -->
        <input type="submit" value="Submit">
    </form>
    
    <!-- iframe to display result -->
    <h2>Result:</h2>
    <iframe 
        name="resultFrame" 
        src="question17_result.html" 
        width="100%" 
        height="200" 
        title="Form Result">
    </iframe>
    
</body>
</html>
