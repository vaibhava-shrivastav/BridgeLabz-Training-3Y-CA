<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <!-- 
        Question 10: Contact Form
        Includes placeholder and required attributes
    -->
    <h1>Contact Form</h1>
    
    <form>
        <!-- Full Name field -->
        <label for="fullName">Full Name:</label><br>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required><br><br>
        
        <!-- Email field -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required><br><br>
        
        <!-- Subject field -->
        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" placeholder="Enter the subject of your message" required><br><br>
        
        <!-- Message textarea -->
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Enter your message here" required></textarea><br><br>
        
        <!-- Submit button -->
        <input type="submit" value="Send Message">
    </form>
    
</body>
</html>
