<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Embed</title>
</head>
<body>
    <!-- 
        Question 1: Embed a YouTube video using iframe
        The width and height are set using percentage values (100%)
        so the video will adjust when resizing the browser window
    -->
    <h1>YouTube Video Embed</h1>
    
    <p>This page embeds a YouTube video that resizes with the browser:</p>
    
    <!-- 
        YouTube iframe embedded with percentage-based dimensions
        This allows the video to be responsive to browser resizing
    -->
    <iframe 
        width="100%" 
        height="400" 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
    </iframe>
    
</body>
</html>
