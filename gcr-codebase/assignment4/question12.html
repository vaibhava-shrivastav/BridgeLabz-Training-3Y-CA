<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <!-- 
        Question 12: HTML Entities Demonstration
        Display special characters and symbols using HTML entities
    -->
    <h1>HTML Entities Demonstration</h1>
    
    <p>
        This paragraph demonstrates various HTML entities:
    </p>
    
    <!-- Special characters using entities -->
    <p>
        Less than symbol: &lt;<br>
        Greater than symbol: &gt;<br>
        Ampersand symbol: &amp;<br>
        Double quote: &quot;<br>
        Single quote: &apos;<br>
    </p>
    
    <!-- Symbols using entities -->
    <p>
        Copyright symbol: &copy;<br>
        Trademark symbol: &trade;<br>
        Registered trademark: &reg;<br>
    </p>
    
</body>
</html>
