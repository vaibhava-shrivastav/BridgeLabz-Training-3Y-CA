<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple iframes</title>
</head>
<body>
    <!-- 
        Question 3: Create a page with two iframes displayed one below another
        First iframe displays the introduction page
        Second iframe displays a hobby page
    -->
    <h1>Multiple iframes Demonstration</h1>
    
    <!-- First iframe displaying the introduction page -->
    <h2>Introduction Page</h2>
    <iframe 
        src="../introduction-to-web/index.html" 
        width="90%" 
        height="350" 
        title="Introduction Page">
    </iframe>
    
    <!-- Second iframe displaying the hobby page -->
    <h2>Hobby Page</h2>
    <iframe 
        src="../introduction-to-web/Form.html" 
        width="90%" 
        height="350" 
        title="Hobby Page">
    </iframe>
    
</body>
</html>
