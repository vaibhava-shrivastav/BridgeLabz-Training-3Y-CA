<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spinner Loader</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			background: #f4f7fb;
			font-family: Arial, sans-serif;
		}

		.loader-container {
			display: grid;
			justify-items: center;
			gap: 14px;
			color: #243447;
			font-size: 1rem;
		}

		.spinner {
			width: 56px;
			height: 56px;
			border: 6px solid #dbe4f0;
			border-top-color: #2563eb;
			border-radius: 50%;
			animation: spin 0.9s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}
	</style>
</head>
<body>
	<main class="loader-container" aria-label="Loading">
		<div class="spinner" role="status" aria-label="Loading"></div>
	</main>
</body>
</html>
